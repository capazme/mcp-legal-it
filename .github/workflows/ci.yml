name: CI

on:
  pull_request:
    branches: [develop, main, "release/**"]
  # main is included so its state is never unverified between releases. It was
  # left failing check_deps_sync for days because CI only ran on develop, and a
  # push to main (the release merge) triggered nothing. release/** is included
  # so long-lived beta release branches (cut by `release.py X.Y.Z-beta.N
  # --beta`) get the same gate as develop/main between beta tags.
  push:
    branches: [develop, main, "release/**"]
    # A tag push runs the same battery, including the directory checks on
    # plugin/, before the release workflow publishes that tag.
    tags: ['*']

permissions:
  contents: read

jobs:
  # Every install path (Docker, plugin, .mcpb) declares the runtime dependency
  # set on its own. Guard against the copies drifting apart — that drift has
  # already shipped a launcher missing python-docx.
  deps-sync:
    name: Dependency declarations in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # script needs tomllib (3.11+)

      - name: Check launchers against pyproject.toml
        run: python scripts/check_deps_sync.py

  # The committed annotations (tool_annotations.py, source_bindings.py,
  # table_bindings.py, docs/cache-inventory.md) are generated from the source
  # with `scripts/audit_tool_annotations.py --write`. A push whose code moved
  # without regenerating them fails here, so a reviewer never has to run the
  # audit to know the policy matches the tool surface it describes.
  policy-sync:
    name: Annotation policy in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the policy and require no diff
        run: |
          python scripts/audit_tool_annotations.py --write
          git diff --exit-code plugin/server/src/tool_annotations.py \
            plugin/server/src/source_bindings.py \
            plugin/server/src/table_bindings.py docs/cache-inventory.md

  # The directory reads plugin/ from this repository and rescans every commit
  # on main before it can be published. Replays its automated checks so a
  # change that would block the listing, or send it to a reviewer for a new
  # reason, fails here first. Stdlib + git: no install step.
  directory-readiness:
    name: Plugin passes the directory checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replay the directory's automated checks on plugin/
        run: python scripts/check_directory_readiness.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
        # The library range is fastmcp>=3.4,<5: test both majors.
        fastmcp: ['3', '4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]" "fastmcp==${{ matrix.fastmcp }}.*"

      - name: Run tests
        run: pytest tests/ -m "not live" -q
