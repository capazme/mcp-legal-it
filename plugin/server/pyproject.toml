[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-legal-it"
version = "2.16.1"
description = "MCP server with 228 Italian legal tools: calculations, legislation (incl. Gazzetta Ufficiale), case law (Cassazione, Corte Costituzionale, CeRDEF, TAR/CdS, CGUE), orientamento, EU→IT implementation mapping, citation verification, CONSOB, GDPR, document generation"
license = {text = "Apache-2.0"}
# The plugin always runs on uv's Python 3.12 (`uv run --python 3.12`); keeping the
# lock to that one interpreter keeps uv.lock small enough for the plugin directory.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=3.4,<5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fpdf2>=2.7",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    # cryptography arrives transitively (fastmcp -> fastmcp-slim[server] -> joserfc).
    # From 49.0.0 it ships no macOS Intel wheel (arm64 only), so x86_64 Macs fall back
    # to a source build that needs Rust + OpenSSL and fails. 48.x still ships
    # macosx_10_9_universal2. Drop this pin once joserfc/cryptography restore Intel wheels.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
mcp-legal-it = "src.cli:main"

[tool.setuptools.package-data]
src = ["data/*.json", "data/references/*.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
# The plugin starts the server with `uv run --frozen --project <plugin>/server`:
# only the locked dependencies are installed, this folder is not built as a
# package, and the user's own project (the session's working directory) is
# never touched.
package = false
# The plugin stays on FastMCP 3 until the 3.x/4.x switch is validated in the
# plugin as well; the declared range above is shared with the library.
constraint-dependencies = ["fastmcp<4"]
