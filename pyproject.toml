[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-legal-it"
version = "3.0.0"
description = "MCP server with 228 Italian legal tools: calculations, legislation, case law (Cassazione, Corte Costituzionale, CeRDEF, TAR/CdS, CGUE), Gazzetta Ufficiale, EU→IT transposition, citation verification, CONSOB, GDPR, document generation"
license = "MPL-2.0"
# NOTICE points at LICENSES/Apache-2.0.txt for the 2.x contributions: every
# artefact that carries the code carries that text too.
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4,<5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fpdf2>=2.7",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    # cryptography arrives transitively (fastmcp -> fastmcp-slim[server] -> joserfc).
    # From 49.0.0 it ships no macOS Intel wheel (arm64 only), so x86_64 Macs fall back
    # to a source build that needs Rust + OpenSSL and fails. 48.x still ships
    # macosx_10_9_universal2. Drop this pin once joserfc/cryptography restore Intel wheels.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everywhere else, the releases that fix PYSEC-2026-3552/3553/3554. Declared
    # explicitly so that a lock (the plugin's uv.lock) forks by platform
    # instead of shipping the Intel-only 48.x to every machine.
    "cryptography>=50; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "playwright>=1.40",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-legal-it = "mcp_legal_it.cli:main"

[tool.setuptools.package-data]
mcp_legal_it = ["data/*.json", "data/references/*.md", "lib/italgiure/*.crt"]

# The package lives in plugin/server/ (the plugin runs it from there); the
# library build picks it up from the same folder, so there is one copy and no
# link at the repository root.
[tool.setuptools.packages.find]
where = ["plugin/server"]
include = ["mcp_legal_it*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The package is importable from a plain checkout, without an install.
pythonpath = ["plugin/server"]
addopts = "-m 'not live'"
markers = [
    "live: live integration tests hitting real APIs",
    "finestra_reale: a unit test of the validity window, without the in-force default for made-up pages",
]
