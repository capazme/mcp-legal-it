<div class="bodyTesto"><h2 class="article-num-akn">Art. 1</h2>
<div class="art-comma-div-akn">Il decorso dei termini processuali relativi alle giurisdizioni ordinarie ed a quelle amministrative è sospeso di diritto dal 1º al 31 agosto di ciascun anno, e riprende a decorrere dalla fine del periodo di sospensione.</div></div>
