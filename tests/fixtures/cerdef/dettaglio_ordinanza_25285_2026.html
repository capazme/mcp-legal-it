		// sommario e dettaglio articoli 
		var xmlDettaglio = '<risultatiRicerca><risultati><Provvedimento idProvvedimento=\"{5015CDA0-0C00-CB4D-B9B4-CB4BA9689597}\" sentenzaSicot=\"false\" flagStato=\"0\" allegato=\"false\"><estremi link=\"false\">Ordinanza del 14\/09\/2026 n. 25285 - Corte di Cassazione - Sezione\/Collegio 5<\/estremi><titoliProvvedimento><titoloProvvedimento><intitolazione><![CDATA[<p>IVA - Rimborsi - Prova pagamento<\/p>]]><\/intitolazione><massima><![CDATA[<p><\/p><p style=\"text-align: justify;\">\u200B\u200BIn tema di rimborso IVA, qualora il contribuente abbia un debito maggiore di quello dichiarato e l\'amministrazione finanziaria non abbia esercitato, entro il termine stabilito dall\'<a href=\"decodeurn?urn=urn:doctrib::DPR:1972;633_art57\">articolo 57, DPR n. 633\/1972<\/a>, il potere di accertamento del maggiore imponibile, quest\'ultima non pu\ò recuperare la decadenza; nondimeno, ove la documentazione che il contribuente \è tenuto a produrre in giudizio per ottenere il riconoscimento del credito che l\'amministrazione gli ha negato, non sia tale da dimostrarne l\'esistenza, il credito deve essergli negato, quale che sia il periodo di tempo trascorso dal momento in cui questo venne esposto in dichiarazione.<\/p><p>Massima redatta a cura del Ce.R.D.E.F.<\/p>]]><\/massima><\/titoloProvvedimento><\/titoliProvvedimento><testo><![CDATA[<p>FATTI DI CAUSA<\/p> <p style=\"text-align: justify;\">Dalla sentenza e dal ricorso si evince che la societ\à (che negli anni \è stata oggetto di incorporazione e che a sua volta era stata societ\à incorporante) impugn\ò dinanzi alla Commissione tributaria provinciale di Roma l\'avviso di accertamento n. (------), con cui l\'Agenzia delle Entrate ebbe a procedere a rettifica della dichiarazione IVA presentata dalla contribuente per l\'anno 2001. Con l\'atto impositivo l\'Ufficio aveva contestato il credito Iva di Euro 248.825,32, che la contribuente aveva chiesto a rimborso, sostenendo che la societ\à, esercitando un\'attivit\à esente da IVA, ex <a href=\"decodeurn?urn=urn:doctrib::DPR:1973;633_art10\">art. 10, D.P.R. n. 633\/73<\/a>, ossia il gioco del bingo, non aveva diritto a recuperare l\'IVA versata sulle operazioni passive. L\'Agenzia delle entrate irrog\ò anche sanzioni per l\'importo di Euro 311.031,65.<\/p> <p style=\"text-align: justify;\">Compensa le spese processuali del presente giudizio e di quello celebrato dinanzi al giudice dell\'ottemperanza.<\/p> <p style=\"text-align: justify;\">Cos\ì decisa in Roma, nella camera di consiglio del 15 ottobre 2025.<\/p> <p>Depositato in Cancelleria il 14 settembre 2026.<\/p>]]><\/testo><\/Provvedimento><\/risultati><\/risultatiRicerca>';
	</script>
