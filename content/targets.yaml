# Capability manifest — the harness-agnostic layer.
# Each projection target declares what the harness supports and how tool
# names are spelled there. Packaging targets bundle a projection's output.
# Adding a harness is a new block here; today the builder still keeps mcpb
# staging in code (plugin/server → server/ remap) — see scripts/build_targets.py.
version: 1

projections:
  claude-code:
    tool_namespace: "legal-it:{tool}"
    # both spellings: a server added by hand, and the same server installed with the plugin
    command_tool_namespace: ["mcp__legal-it__{tool}", "mcp__plugin_legal-it_legal-it__{tool}"]
    strip_frontmatter_keys: [tools, prompt, standalone-description]
    supports: [skills, agents, commands, mcp_prompts, mcp_resources, hooks]
    out:
      skills: plugin/skills
      agents: plugin/agents
      commands: plugin/commands
      references: plugin/server/mcp_legal_it/data/references
  openai:
    tool_namespace: "{tool}"        # bare — stable across Codex's mcp__server__tool / server__tool modes
    strip_frontmatter_keys: [tools, prompt, standalone-description]
    supports: [skills]
    merge_into_skills: [agents, commands]
    exclude: [commands/digest, skills/cookie-audit, skills/esporta-documento]
    description_max_chars: 185
    out:
      skills: dist/openai/.agents/skills

packaging:
  claude-web:
    from: claude-code
    # outside the plugin folder: these archives ship as release assets, not in the plugin
    out_dir: dist/web-skills
    description_max_chars: 200
    keep_frontmatter: [name, description]
    zip_member: "{name}/Skill.md"
  plugin-zip:
    from: claude-code
    artifact: "dist/legal-it-plugin-{version}.zip"
    include: [.claude-plugin, skills, agents, commands, hooks, .mcp.json, server, README.md, LICENSE, NOTICE, LICENSES]
    root: plugin
    version_manifest: ".claude-plugin/plugin.json"
  # staging file-set kept in code: the server→server/ remap doesn't fit a flat include list
  mcpb:
    from: claude-code
    artifact: "dist/legal-it-{version}.mcpb"
    version_manifest: "manifest.json"
  openai-zip:
    artifact: "dist/legal-it-openai-skills-{version}.zip"
    root: dist/openai   # no from:: read directly by build_openai_zip() (build_openai() derives the
                        # same root from the openai projection's out.skills instead of a literal)
